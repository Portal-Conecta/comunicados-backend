services:
  postgres:
    image: postgres:16-alpine
    container_name: portal-conecta-comunicados-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comunicados}
      POSTGRES_USER: ${POSTGRES_USER:-comunicados}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comunicados_dev_password}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: portal-conecta-comunicados-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-conecta-comunicados-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-comunicados}
      DB_USERNAME: ${POSTGRES_USER:-comunicados}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-comunicados_dev_password}
      DB_DRIVER: org.postgresql.Driver
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-true}
      JWT_SECRET: ${JWT_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      HUB_API_URL: ${HUB_API_URL:-http://host.docker.internal:8080}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      MESSAGING_ENABLED: ${MESSAGING_ENABLED:-true}
      # Storage S3 — default seguro em mock; para testar S3 real, defina no .env:
      # STORAGE_MOCK_ENABLED=false + AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (usuário comunicados-presigner)
      STORAGE_MOCK_ENABLED: ${STORAGE_MOCK_ENABLED:-false}
      STORAGE_IMAGES_BUCKET: ${STORAGE_IMAGES_BUCKET:-comunicados-raw-sa}
      STORAGE_FILES_BUCKET: ${STORAGE_FILES_BUCKET:-comunicados-processed-sa}
      STORAGE_REGION: ${STORAGE_REGION:-sa-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "${SERVER_PORT:-8083}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
