spring:
  application:
    name: comunicados
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE_MB:10}MB
      max-request-size: ${STORAGE_MAX_FILE_SIZE_MB:10}MB
  profiles:
    active: dev
  jpa:
    open-in-view: false
  flyway:
    enabled: false
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

server:
  port: ${SERVER_PORT:8083}

app:
  scheduling:
    auto-publish:
      enabled: ${AUTO_PUBLISH_ENABLED:true}
      cron: ${AUTO_PUBLISH_CRON:0 * * * * *}
    cleanup-orphans:
      enabled: ${CLEANUP_ORPHANS_ENABLED:true}
      cron: ${CLEANUP_ORPHANS_CRON:0 0 * * * *}
      max-age-hours: ${CLEANUP_ORPHANS_MAX_AGE_HOURS:24}
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
    core:
      queue: comunicados.core-entities
      dlq: comunicados.core-entities.dlq
      class-exchange:
        name: class-events.exchange
        routing-keys:
          - class.created
          - class.deleted
      course-exchange:
        name: course-events.exchange
        routing-keys:
          - course.created
          - course.updated
          - course.deleted
    notification:
      exchange: notifications.exchange
      routing-key: notification.requested

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true

storage:
  mock-enabled: ${STORAGE_MOCK_ENABLED:true}
  max-files-per-announcement: ${STORAGE_MAX_FILES:5}
  max-file-size-mb: ${STORAGE_MAX_FILE_SIZE_MB:10}
  # Limites por tipo de arquivo (usados na validação do presign)
  max-image-size-mb: ${STORAGE_MAX_IMAGE_SIZE_MB:10}
  max-document-size-mb: ${STORAGE_MAX_DOCUMENT_SIZE_MB:20}
  max-video-size-mb: ${STORAGE_MAX_VIDEO_SIZE_MB:200}
  # Bucket A: recebe todo upload raw via presign (imagem, pdf, video, svg); Lambda é
  # triggerada aqui — comprime imagens raster e preserva os demais tipos como estão
  images-bucket: ${STORAGE_IMAGES_BUCKET:}
  # Bucket B: destino exclusivo da Lambda — imagens comprimidas e demais tipos
  # preservados, ambos copiados para .../processed/{fileId}. Nada é enviado direto aqui
  files-bucket: ${STORAGE_FILES_BUCKET:}
  region: ${STORAGE_REGION:sa-east-1}

hub:
  api:
    url: ${HUB_API_URL:http://localhost:8080}
    mock-enabled: ${HUB_MOCK_ENABLED:true}
  mock:
    class-ids: []
    user-ids: []
    room-ids: []
    user-room-links: []
    students-by-class: {}
    accessible-class-ids-by-user: {}
    user-types-by-id: {}
