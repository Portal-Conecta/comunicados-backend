spring:
  application:
    name: comunicados
  profiles:
    active: dev
  jpa:
    open-in-view: false
  flyway:
    enabled: false
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true

hub:
  base-url: ${HUB_API_URL:http://localhost:8080}
