spring:
  application:
    name: comunicados
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE_MB:10}MB
      max-request-size: ${STORAGE_MAX_FILE_SIZE_MB:10}MB
  profiles:
    active: dev
  jpa:
    open-in-view: false
  flyway:
    enabled: false
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

server:
  port: ${SERVER_PORT:8083}

app:
  scheduling:
    auto-publish:
      enabled: ${AUTO_PUBLISH_ENABLED:true}
      cron: ${AUTO_PUBLISH_CRON:0 * * * * *}
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
    core:
      exchange: portal.core.events
      queue: comunicados.core-entities
      dlq: comunicados.core-entities.dlq
      routing-keys:
        - core.course.#
        - core.class.#
        - core.user.#

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true

storage:
  mock-enabled: ${STORAGE_MOCK_ENABLED:true}
  max-files-per-announcement: ${STORAGE_MAX_FILES:5}
  max-file-size-mb: ${STORAGE_MAX_FILE_SIZE_MB:10}

hub:
  api:
    url: ${HUB_API_URL:http://localhost:8080}
    mock-enabled: ${HUB_MOCK_ENABLED:true}
  mock:
    class-ids: []
    user-ids: []
    room-ids: []
    user-room-links: []
    students-by-class: {}
    accessible-class-ids-by-user: {}
    user-types-by-id: {}
